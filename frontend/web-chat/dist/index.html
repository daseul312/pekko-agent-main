    <script>
        // 테이블 데이터를 Excel(.xlsx)로 다운로드
        function downloadTableAsCSV(messageId) {
            console.log('downloadTableAsCSV called with:', messageId);
            const msgEl = document.getElementById('msg-' + messageId);
            console.log('Found element:', msgEl);
            if (!msgEl) {
                console.error('Element not found: msg-' + messageId);
                // DOM에서 모든 msg- ID 출력
                document.querySelectorAll('[id^="msg-"]').forEach(el => console.log('Available:', el.id));
                return;
            }
            
            const table = msgEl.querySelector('table');
            console.log('Found table:', table);
            if (!table) {
                alert('테이블을 찾을 수 없습니다.');
                return;
            }
            
            // SheetJS로 테이블을 워크북으로 변환
            console.log('XLSX available:', typeof XLSX);
            try {
                const wb = XLSX.utils.book_new();
                console.log('Workbook created');
            const ws = XLSX.utils.table_to_sheet(table);
            
            // 컬럼 너비 자동 조정
            const cols = [];
            const range = XLSX.utils.decode_range(ws['!ref']);
            for (let c = range.s.c; c <= range.e.c; c++) {
                let maxLen = 10;
                for (let r = range.s.r; r <= range.e.r; r++) {
                    const cell = ws[XLSX.utils.encode_cell({r, c})];
                    if (cell && cell.v) {
                        const len = String(cell.v).length;
                        if (len > maxLen) maxLen = Math.min(len, 50);
                    }
                }
                cols.push({ wch: maxLen + 2 });
            }
            ws['!cols'] = cols;
            
            XLSX.utils.book_append_sheet(wb, ws, 'Data');
            
            // 파일 다운로드 (명시적 Blob 방식)
            const filename = 'data_' + new Date().toISOString().slice(0,10) + '.xlsx';
            console.log('Downloading:', filename);
            
            // Blob으로 변환 후 다운로드
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            console.log('Download triggered!');
            } catch (e) {
                console.error('XLSX error:', e);
            }
        }
        function getElementRect(id) {
            const el = document.getElementById(id);
            if (!el) return null;
            const rect = el.getBoundingClientRect();
            return JSON.stringify({
                top: rect.top,
                left: rect.left,
                width: rect.width,
                height: rect.height
            });
        }
    </script>
