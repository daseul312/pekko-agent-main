      function patchBoardPostEditable(editor, elementId) {
        const editable =
          editor?.ui?.view?.editable?.element ||
          editor?.editing?.view?.getDomRoot?.() ||
          document
            .getElementById(elementId)
            ?.closest(".board-post-editor-shell")
            ?.querySelector(".ck-editor__editable");

        if (!editable) return false;

        editable.setAttribute("contenteditable", "true");
        editable.setAttribute("aria-readonly", "false");
        editable.removeAttribute("readonly");
        editable.removeAttribute("disabled");
        editable.style.pointerEvents = "auto";
        editable.style.userSelect = "text";
        editable.style.webkitUserSelect = "text";
        editable.style.caretColor = "#0f172a";
        editable.style.color = "#0f172a";
        editable.style.backgroundColor = "#fff";
        editable.tabIndex = 0;

        editable.addEventListener("mousedown", () => {
          setTimeout(() => {
            try {
              editor.editing.view.focus();
            } catch {
              editable.focus();
            }
          }, 0);
        });

        editable.addEventListener("click", () => {
          try {
            editor.editing.view.focus();
          } catch {
            editable.focus();
          }
        });

        return true;
      }

      function showBoardPostEditorFallback(elementId, initialData, onChange) {
        const element = document.getElementById(elementId);
        if (!element) return;

        const shell =
          element.closest(".board-post-editor-shell") || element.parentElement;
        if (!shell) return;

        shell.innerHTML = "";
        const textarea = document.createElement("textarea");
        textarea.id = elementId;
        textarea.className = "board-post-editor-fallback";
        textarea.value = initialData || "";
        textarea.placeholder = "내용을 입력해주세요.";
        textarea.addEventListener("input", () => {
          if (typeof onChange === "function") {
            onChange(textarea.value);
          }
        });
        shell.appendChild(textarea);
        boardPostEditors.set(elementId, {
          getData: () => textarea.value,
          destroy: () => {},
          fallback: true,
        });
      }

      window.initBoardPostEditor = async function (
        elementId,
        initialData,
        onChange,
      ) {
        const element = document.getElementById(elementId);
        if (!element) return;

        if (!document.head) {
          await new Promise((resolve) => {
            const observer = new MutationObserver(() => {
              if (document.head) {
                observer.disconnect();
                resolve();
              }
            });
            observer.observe(document.documentElement, { childList: true });
          });
        }

        if (boardPostEditors.has(elementId)) {
          window.destroyBoardPostEditor(elementId);
        }

        if (!boardPostCloudLicenseKey()) {
          showBoardPostEditorFallback(elementId, initialData, onChange);
          return;
        }

        try {
          const config = boardPostEditorConfig(initialData);
          const editor = await createBoardPostClassicEditor(element, config);
          boardPostEditors.set(elementId, editor);

          if (!initialData) {
            try {
              editor.execute("fontSize", { value: "11pt" });
            } catch {}
          }

          try {
            const schema = editor.model.schema;
            const conversion = editor.conversion;
            if (!schema.isRegistered || !schema.isRegistered("dl")) {
              schema.register("dl", {
                allowWhere: "$block",
                allowContentOf: "$block",
              });
              schema.register("dt", {
                allowIn: "dl",
                allowContentOf: "$block",
              });
              schema.register("dd", {
                allowIn: "dl",
                allowContentOf: "$block",
              });
              conversion.elementToElement({ model: "dl", view: "dl" });
              conversion.elementToElement({ model: "dt", view: "dt" });
              conversion.elementToElement({ model: "dd", view: "dd" });
              conversion
                .for("upcast")
                .elementToElement({ view: "dl", model: "dl" });
              conversion
                .for("upcast")
                .elementToElement({ view: "dt", model: "dt" });
              conversion
                .for("upcast")
                .elementToElement({ view: "dd", model: "dd" });
            }
          } catch {}

          const editablePatched = patchBoardPostEditable(editor, elementId);
          if (!editablePatched || editor.isReadOnly) {
            try {
              if (typeof editor.disableReadOnlyMode === "function") {
                editor.disableReadOnlyMode("board-post-submit");
              } else {
                editor.isReadOnly = false;
              }
            } catch {}
            patchBoardPostEditable(editor, elementId);
          }

          editor.model.document.on("change:data", () => {
            if (typeof onChange === "function") {
              onChange(editor.getData());
            }
          });

          setTimeout(() => patchBoardPostEditable(editor, elementId), 50);
        } catch (err) {
          console.error("Board post CKEditor init failed", err);
          showBoardPostEditorFallback(elementId, initialData, onChange);
        }
      };

      window.destroyBoardPostEditor = function (elementId) {
        const editor = boardPostEditors.get(elementId);
        if (!editor) return;
        boardPostEditors.delete(elementId);
        if (editor.fallback) return;
        Promise.resolve(editor.destroy()).catch((err) => {
          console.error("Board post CKEditor destroy failed", err);
        });
      };

      window.getBoardPostEditorData = function (elementId) {
        const editor = boardPostEditors.get(elementId);
        return editor ? editor.getData() : "";
      };

      window.setBoardPostEditorDisabled = function (elementId, disabled) {
        const editor = boardPostEditors.get(elementId);
        if (!editor) return;

        if (disabled) {
          if (typeof editor.enableReadOnlyMode === "function") {
            editor.enableReadOnlyMode("board-post-submit");
          } else {
            editor.isReadOnly = true;
          }
        } else if (typeof editor.disableReadOnlyMode === "function") {
          editor.disableReadOnlyMode("board-post-submit");
        } else {
          editor.isReadOnly = false;
        }
      };

      // 테이블 데이터를 Excel(.xlsx)로 다운로드
      function formatLocalDate(date = new Date()) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function sanitizeExcelFilename(value) {
        const fallback = "data";
        const sanitized = String(value || "")
          .replace(/[<>:"/\\|?*]+/g, " ")
          .replace(/[\u0000-\u001f]/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .replace(/[. ]+$/, "");

        if (!sanitized) {
          return fallback;
        }

        return sanitized.slice(0, 80).replace(/[. ]+$/, "") || fallback;
      }

      function findSourceQuestion(msgEl) {
        const row = msgEl.closest(".message-row");
        let current = row ? row.previousElementSibling : null;

        while (current) {
          if (current.classList.contains("user")) {
            const bubble = current.querySelector(".message-bubble");
            const text = bubble ? bubble.textContent : "";
            if (text && text.trim()) {
              return text.trim();
            }
          }
          current = current.previousElementSibling;
        }

        return "";
      }

      function normalizeQuestionForFilename(value) {
        let normalized = String(value || "")
          .replace(/[?!.]+$/g, "")
          .replace(/\s+/g, " ")
          .trim();

        const trailingPatterns = [
          /\s+(요약해서|정리해서)\s+(보여|알려)(줘|주세요|줘요|주시겠어요)$/u,
          /\s+(엑셀로\s+다운로드|엑셀\s+다운로드|엑셀로\s+정리|엑셀로\s+만들어|파일로\s+만들어|표로\s+만들어|다운로드|내려받아|조회|요약|정리|확인|출력|추출|작성|생성|비교|설명|분석)(해\s?줘|해\s?주세요|해주세요|해줘요|해\s?줘요|해주시겠어요)$/u,
          /\s+(보여|알려|찾아|만들어)(줘|주세요|줘요|주시겠어요)$/u,
        ];

        for (const pattern of trailingPatterns) {
          const replaced = normalized.replace(pattern, "").trim();
          if (replaced !== normalized) {
            normalized = replaced;
            break;
          }
        }

        normalized = normalized
          .replace(
            /\s+(해줘|해\s?줘|해주세요|해\s?주세요|줘|주세요|부탁해|부탁해요|부탁드립니다)$/u,
            "",
          )
          .replace(/\s+좀$/u, "")
          .trim();

        return normalized || String(value || "").trim();
      }

      function downloadTableAsCSV(messageId) {
        console.log("downloadTableAsCSV called with:", messageId);
        const msgEl = document.getElementById("msg-" + messageId);
        console.log("Found element:", msgEl);
        if (!msgEl) {
          console.error("Element not found: msg-" + messageId);
          // DOM에서 모든 msg- ID 출력
          document
            .querySelectorAll('[id^="msg-"]')
            .forEach((el) => console.log("Available:", el.id));
          return;
        }

        const table = msgEl.querySelector("table");
        console.log("Found table:", table);
        if (!table) {
          alert("테이블을 찾을 수 없습니다.");
          return;
        }

        // SheetJS로 테이블을 워크북으로 변환
        console.log("XLSX available:", typeof XLSX);
        try {
          const wb = XLSX.utils.book_new();
          console.log("Workbook created");
          const ws = XLSX.utils.table_to_sheet(table);

          // 컬럼 너비 자동 조정
          const cols = [];
          const range = XLSX.utils.decode_range(ws["!ref"]);
          for (let c = range.s.c; c <= range.e.c; c++) {
            let maxLen = 10;
            for (let r = range.s.r; r <= range.e.r; r++) {
              const cell = ws[XLSX.utils.encode_cell({ r, c })];
              if (cell && cell.v) {
                const len = String(cell.v).length;
                if (len > maxLen) maxLen = Math.min(len, 50);
              }
            }
            cols.push({ wch: maxLen + 2 });
          }
          ws["!cols"] = cols;

          XLSX.utils.book_append_sheet(wb, ws, "Data");

          // 파일 다운로드 (명시적 Blob 방식)
          const filename =
            sanitizeExcelFilename(
              normalizeQuestionForFilename(findSourceQuestion(msgEl)),
            ) +
            "_" +
            formatLocalDate() +
            ".xlsx";
          console.log("Downloading:", filename);

          // Blob으로 변환 후 다운로드
          const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
          const blob = new Blob([wbout], {
            type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
          });
          const url = URL.createObjectURL(blob);

          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          console.log("Download triggered!");
        } catch (e) {
          console.error("XLSX error:", e);
        }
      }

      // ── 답변 내 데이터 시각화(Chart.js) ──
      // 라이트/다크 공통으로 무난한 차트 팔레트. donut 세그먼트/다계열에서 순환 사용.
      const CHART_PALETTE = [
        "#5ec8a0", // green
        "#e0b15e", // amber
        "#6aa6f0", // blue
        "#e07a7a", // red
        "#b08ce0", // purple
        "#5ec8c8", // teal
        "#e09a5e", // orange
        "#9ab05e", // olive
      ];

      function chartCssVar(name, fallback) {
        const v = getComputedStyle(document.documentElement).getPropertyValue(name);
        return (v && v.trim()) || fallback;
      }

      // Rust ChartBlock이 마운트 후 호출. specJson = 백엔드 ChartData 직렬화 결과.
      // 같은 canvas에 이미 그려진 차트가 있으면 제거 후 재생성한다(테마 전환/페이지 전환 대비).
      function renderChart(canvasId, specJson) {
        if (typeof Chart === "undefined") {
          console.error("renderChart: Chart.js not loaded");
          return;
        }
        const canvas = document.getElementById(canvasId);
        if (!canvas) {
          console.warn("renderChart: canvas not found:", canvasId);
          return;
        }
        let spec;
        try {
          spec = JSON.parse(specJson);
        } catch (e) {
          console.error("renderChart: invalid spec JSON", e);
          return;
        }

        const existing = Chart.getChart(canvas);
        if (existing) existing.destroy();

        const textColor = chartCssVar("--muted", "#94a3b8");
        const gridColor = chartCssVar("--border", "rgba(148,163,184,0.2)");
        const accent = chartCssVar("--accent", "#ffc700");
        const surface = chartCssVar("--chat-bg", "#1a2333");

        const type =
          spec.chart_type === "donut"
            ? "doughnut"
            : spec.chart_type === "line"
            ? "line"
            : "bar";
        const isPie = type === "doughnut";
        const labels = spec.labels || [];
        const series = spec.series || [];

        const datasets = series.map((s, i) => {
          if (isPie) {
            return {
              label: s.name,
              data: s.values,
              backgroundColor: labels.map(
                (_, j) => CHART_PALETTE[j % CHART_PALETTE.length],
              ),
              borderColor: surface,
              borderWidth: 2,
            };
          }
          const color =
            series.length === 1 ? accent : CHART_PALETTE[i % CHART_PALETTE.length];
          return {
            label: s.name,
            data: s.values,
            backgroundColor: type === "line" ? "transparent" : color,
            borderColor: color,
            borderWidth: 2,
            borderRadius: type === "bar" ? 6 : 0,
            tension: 0.3,
            pointRadius: type === "line" ? 3 : 0,
            fill: false,
            maxBarThickness: 64,
          };
        });

        const showLegend = isPie || series.length > 1;
        const config = {
          type,
          data: { labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: showLegend,
                position: isPie ? "bottom" : "top",
                labels: { color: textColor, boxWidth: 12, padding: 12 },
              },
              title: { display: false },
              tooltip: { enabled: true },
            },
            scales: isPie
              ? {}
              : {
                  x: { ticks: { color: textColor }, grid: { color: gridColor } },
                  y: {
                    beginAtZero: true,
                    ticks: { color: textColor, precision: 0 },
                    grid: { color: gridColor },
                  },
                },
          },
        };

        try {
          new Chart(canvas, config);
        } catch (e) {
          console.error("renderChart: Chart() failed", e);
        }
      }

      function getElementRect(id) {
        const el = document.getElementById(id);
        if (!el) return null;
        const rect = el.getBoundingClientRect();
        return JSON.stringify({
          top: rect.top,
          left: rect.left,
          width: rect.width,
          height: rect.height,
        });
      }
    </script>

    class Client {

                switch (msg.type) {
                    case "reload":
