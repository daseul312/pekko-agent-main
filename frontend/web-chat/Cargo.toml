[package]
name = "pekko-agent-web-chat"
version = "0.1.0"
edition = "2021"
description = "EHS AI Agent ??梨꾪똿 UI (WASM)"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
gloo-net = { version = "0.6", features = ["json"] }
gloo-events = "0.2"

gloo-storage = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js", "serde"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "FormData",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "HtmlDocument",
    "HtmlElement",
    "File",
    "FileList",
    "CssStyleDeclaration",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "RequestCredentials",
    "KeyboardEvent",
    "Window",
    "Document",
    "Element",
    "EventTarget",
    "Clipboard",    
    "Navigator",    
] }
log = "0.4"
wasm-logger = "0.2"
chrono = { version = "0.4", features = ["wasmbind", "serde"] }
